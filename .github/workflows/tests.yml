name: Offline research invariants
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core/test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run offline invariant tests
        run: PYTHONPATH=src python -m pytest -q tests
      - name: Synthetic CLI integration smoke
        run: PYTHONPATH=src python -m cwt_quant.cli --ticker AAPL --out /tmp/cwt-ci-smoke
