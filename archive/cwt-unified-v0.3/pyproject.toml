[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwt-unified-research"
version = "0.3.0"
description = "CWT real-source gated n+1..n+5 walkforward research forecaster"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "exchange_calendars>=4,<5", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["yfinance>=0.2,<1", "vaderSentiment>=3.3,<4"]
apify = ["apify-client>=2,<4"]
news = ["tavily-python>=0.5", "exa-py>=1"]

[project.scripts]
cwt-unified = "cwt_unified.cli:main"
cwt-real = "cwt_unified.real_run:main"
cwt-apify-authorized = "cwt_unified.apify_acquire:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
